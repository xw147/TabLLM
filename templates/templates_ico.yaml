dataset: ico 
templates:

  # 🔹 Original prompt
  ico-fraud-classification-original: !Template
    name: ico_fraud_detection
    id: ico-fraud-classification-001
    reference: 'ICO Fraud Classification using TabLLM'
    answer_choices: 'No ||| Yes' # No: label 0; Yes: label 1
    jinja: '{{note}}
      Does this ICO project exhibit signs of fraud risk? Yes or No?  
      Answer using exactly one word: 
      |||
      {{ answer_choices[label] }}' 
      # answer choices are only used in evaluation later, not in the prompt
      # 'label' here is the grouth truth label for each sample
    metadata: !TemplateMetadata
      choices_in_prompt: true
      metrics: ['auprc','f1', 'precision', 'recall', 'specificity', 'auroc', 'f1_binary', 'macro_f1', 'accuracy']
      original_task: true


  